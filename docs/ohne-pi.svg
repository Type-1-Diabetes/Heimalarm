<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Ohne Zentrale: Das Handy empfängt den Alarm, meldet ihn an den PC und schaltet Licht und Alexa">
  <style>
    .bg{fill:#0e1013}.box{fill:#171a1f;stroke:#2c313a;stroke-width:1.5}.hub{fill:#1d1414;stroke:#e5432f;stroke-width:2}.lim{fill:#2e2413;stroke:none}
    .t{font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f1f2f4}.s{font:400 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#9aa1ad}
    .h{font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#9aa1ad;letter-spacing:.04em}.w{font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e9a945}
    .ws{font:400 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#d9c9a8}
    .a{stroke:#e5432f;stroke-width:2.5;fill:none}.o{stroke:#4cc287;stroke-width:2;fill:none}.b{stroke:#7cb0e4;stroke-width:2;fill:none;stroke-dasharray:6 5}
    @media (prefers-color-scheme: light){.bg{fill:#f6f6f4}.box{fill:#fff;stroke:#d9dbe0}.hub{fill:#fdf0ee}.lim{fill:#fbf0dc}.t{fill:#16181c}.s,.h{fill:#5b6270}.w{fill:#9a6410}.ws{fill:#6b5426}}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e5432f"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4cc287"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7cb0e4"/></marker>
  </defs>
  <rect class="bg" width="1000" height="440" rx="4"/>
  <text class="h" x="28" y="34">ALARM KOMMT AN</text><text class="h" x="300" y="34">OHNE ZENTRALE</text><text class="h" x="752" y="34">ZUHAUSE PASSIERT</text>

  <rect class="box" x="28" y="52" width="210" height="96" rx="3"/><text class="t" x="46" y="83">Alarm-Apps</text><text class="s" x="46" y="105">SYBOS · aPager PRO</text><text class="s" x="46" y="124">Divera 24/7</text>
  <path class="a" d="M238 100H296" marker-end="url(#ar)"/>

  <rect class="hub" x="300" y="52" width="250" height="160" rx="3"/>
  <text class="t" x="320" y="83">Heimalarm am Handy</text>
  <text class="s" x="320" y="110">liest die Alarm-App mit</text>
  <text class="s" x="320" y="132">meldet an den PC (WLAN)</text>
  <text class="s" x="320" y="154">führt die Routinen aus</text>
  <text class="s" x="320" y="176">Rückmeldung an Divera, aPager</text>

  <rect class="box" x="752" y="52" width="220" height="56" rx="3"/><text class="t" x="770" y="77">PC</text><text class="s" x="770" y="97">„Fährst du?“ · Ruhezustand</text>
  <rect class="box" x="752" y="124" width="220" height="56" rx="3"/><text class="t" x="770" y="149">Licht &amp; Steckdosen</text><text class="s" x="770" y="169">Shelly · Hue · WLED · Tasmota</text>
  <rect class="box" x="752" y="196" width="220" height="56" rx="3"/><text class="t" x="770" y="221">Alexa</text><text class="s" x="770" y="241">Routine über Voice Monkey</text>
  <path class="a" d="M550 80H748" marker-end="url(#ar)"/><text class="s" x="590" y="72">Kopplungscode</text>
  <path class="o" d="M550 152H748" marker-end="url(#ag)"/><text class="s" x="590" y="144">direkt im WLAN</text>
  <path class="o" d="M550 196C640 196 660 224 748 224" marker-end="url(#ag)"/><text class="s" x="590" y="228">per Internet</text>
  <path class="b" d="M133 148V272H988V80H978" marker-end="url(#ab)"/><text class="s" x="150" y="264">Divera: Der PC fragt auch selbst ab</text>

  <text class="h" x="28" y="306">GRENZEN OHNE PI</text>
  <rect class="lim" x="28" y="318" width="226" height="94" rx="3"/><text class="w" x="44" y="344">Handy im WLAN</text><text class="ws" x="44" y="366">Nur dann erreicht es</text><text class="ws" x="44" y="385">PC und Lampen.</text>
  <rect class="lim" x="268" y="318" width="226" height="94" rx="3"/><text class="w" x="284" y="344">Kein Zigbee</text><text class="ws" x="284" y="366">Zigbee-Lampen nur über</text><text class="ws" x="284" y="385">eine Hue Bridge.</text>
  <rect class="lim" x="508" y="318" width="226" height="94" rx="3"/><text class="w" x="524" y="344">Android im Hintergrund</text><text class="ws" x="524" y="366">Akku-Optimierung für</text><text class="ws" x="524" y="385">Heimalarm ausschalten.</text>
  <rect class="lim" x="748" y="318" width="224" height="94" rx="3"/><text class="w" x="764" y="344">Alexa über Cloud</text><text class="ws" x="764" y="366">Voice Monkey braucht</text><text class="ws" x="764" y="385">Internet. Google: nur mit Zentrale.</text>
</svg>
