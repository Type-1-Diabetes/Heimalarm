# Heimalarm – ESP32-S3 (z. B. DevKitC-1 N16R8) an der Ladeschale (Motorola TPG2200)
# Verdrahtung: Relais Pol A -> GPIO4, Pol B -> GND. Interner Pull-up, kein Widerstand nötig.
# Flashen: esphome run <datei>.yaml (siehe docs/anleitungen) oder ESPHome-Dashboard.
# Für weitere Personen Datei kopieren und "ich" überall durch die eigene Kennung ersetzen.

substitutions:
  kennung: ich   # DEINE Kennung: kurzer Name, nur a-z, 0-9 und -, z. B. daniel. Gleich wie „Meine Kennung“ in der App. Jede Person eine eigene!

# LED: farbige LED auf dem Board (GPIO48). Sitzt sie bei dir an GPIO38 (v1.1), unten rgb-gpio38.yaml eintragen.
# Was sie bei welchem Ereignis zeigt: led/logik.yaml bzw. App → Einstellungen → ESP32 → LED.
packages:
  led_logik: !include { file: led/logik.yaml, vars: { led_rgb: "true", led_typ: "rgb" } }
  led_hw: !include led/rgb-gpio48.yaml

esphome:
  name: alarm-${kennung}
  comment: "ESP32-S3 (z. B. DevKitC-1 N16R8) – nur für dieses Board"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB

logger:
  hardware_uart: UART0   # Log über die Buchse COM/UART (sonst nur über die Buchse USB)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pw

http_request:

ota:
  - platform: esphome          # Update per ESPHome/Browser
    password: !secret ota_pw
    on_begin: [ globals.set: { id: led_ota, value: 'true' } ]
    on_error: [ globals.set: { id: led_ota, value: 'false' } ]
  - platform: http_request     # A10 – Update aus der App (Datei im Heimnetz)
    on_begin: [ globals.set: { id: led_ota, value: 'true' } ]
    on_error: [ globals.set: { id: led_ota, value: 'false' } ]

# MQTT statt api: (sonst startet das Gerät regelmäßig neu, weil kein API-Client verbindet)
mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_user
  password: !secret mqtt_pw
  topic_prefix: alarm/${kennung}   # Status "online"/"offline" unter alarm/<kennung>/status
  on_message:
    # A10 – App sendet "<url>|<md5>" an alarm/<kennung>/ota
    - topic: alarm/${kennung}/ota
      then:
        # Nur "<http(s)-Adresse>|<32-stellige MD5>" annehmen, alles andere verwerfen
        - if:
            condition:
              lambda: |-
                size_t p = x.find("|");
                if (p == std::string::npos || x.size() - p - 1 != 32) return false;
                if (x.rfind("http://", 0) != 0 && x.rfind("https://", 0) != 0) return false;
                for (size_t i = p + 1; i < x.size(); i++) if (!isxdigit((unsigned char) x[i])) return false;
                return true;
            then:
              - ota.http_request.flash:
                  url: !lambda 'return x.substr(0, x.find("|"));'
                  md5: !lambda 'return x.substr(x.find("|") + 1);'

# A3 – Mindestdauer des Kontakts, aus der App einstellbar (alarm/<kennung>/number/min_duration/command)
number:
  - platform: template
    name: "Min Duration"
    id: min_duration
    optimistic: true
    restore_value: true
    initial_value: 50
    min_value: 10
    max_value: 5000
    step: 10
    unit_of_measurement: ms

# Einstellungen aus der App (alarm/<kennung>/switch/<name>/command)
switch:
  # Kontakt öffnet bei Alarm statt zu schließen (je nach Ladeschale). Bleibt nach Neustart erhalten.
  - platform: template
    name: "Alarm bei offen"
    id: alarm_bei_offen
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  # Kontakt-Test: Melder meldet keinen Alarm, die App zeigt nur offen/geschlossen. Endet nach 10 Minuten von selbst.
  - platform: template
    name: "Kontakt Test"
    id: kontakt_test
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: test_ende
    on_turn_off:
      - script.stop: test_ende

script:
  - id: test_ende
    mode: restart
    then:
      - delay: 10min
      - switch.turn_off: kontakt_test

binary_sensor:
  # Roher Kontakt, ohne Mindestdauer: ON = geschlossen. Für den Kontakt-Test in der App.
  - platform: gpio
    name: "Kontakt"
    id: kontakt
    pin:
      number: GPIO4
      mode: { input: true, pullup: true }
      inverted: true
  - platform: template
    name: "Melder Alarm"
    lambda: 'return id(kontakt).state != id(alarm_bei_offen).state;'
    filters:
      - delayed_on: !lambda 'return (uint32_t) id(min_duration).state;'   # Entprellen / Mindestdauer
    on_press:
      - if:
          condition:
            switch.is_off: kontakt_test
          then:
            - mqtt.publish:
                topic: alarm/${kennung}
                payload: "ALARM"
                qos: 1
            - globals.set: { id: led_alarm_bis, value: !lambda 'return millis() + 60000;' }   # LED: rot, bis der Kontakt öffnet, höchstens 60 s
    on_release:
      - lambda: 'if (id(led_alarm_bis) > millis() + 3000) id(led_alarm_bis) = millis() + 3000;' 

# Infos für die Übersicht der App (WLAN-Signal, Laufzeit, IP, Firmware)
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

text_sensor:
  # Firmware-Stand für die App (warnt bei älterem ESP32). Bei Änderungen an der Firmware in ALLEN alarm-ich*.yaml hochzählen.
  - platform: template
    name: "Heimalarm Firmware"
    lambda: 'return {"1"};'  # HEIMALARM_FW 1
    update_interval: 300s
  - platform: wifi_info
    ip_address:
      name: "IP"
  - platform: version
    name: "Version"
    hide_timestamp: true
