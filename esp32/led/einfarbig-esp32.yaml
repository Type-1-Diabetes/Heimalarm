# Einfarbige blaue LED vieler ESP32-DevKit-Boards an GPIO2. Nur hell/dunkel und Blinkmuster.
output:
  - platform: ledc
    id: led_out
    pin: GPIO2
light:
  - platform: monochromatic
    id: status_led
    internal: true
    output: led_out
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
