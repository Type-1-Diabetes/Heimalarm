# Heimalarm – Status-LED am ESP32 (gemeinsame Logik für alle Boards)
# Eingebunden aus alarm-ich*.yaml über packages:. Die Hardware (Pin, RGB oder einfarbig) steht in rgb-*.yaml bzw. einfarbig-*.yaml.
# Die App stellt alles unter Einstellungen → ESP32 → LED ein (MQTT, siehe Context.md):
#   switch/led, switch/led_ruhelicht, number/led_helligkeit, select/led_modus, text_sensor/led_typ
#   alarm/<kennung>/led/status  ready | away | absent   (Bereitschaft, retained)
#   alarm/<kennung>/led/test    test | demo              (Test-Lauf bzw. alle Farben nacheinander)
#
# Ereignis                 RGB-LED                         einfarbige LED
# Alarm (Kontakt)          rot, schnell blinkend           schnell blinkend
# Firmware-Update          türkis, sehr schnell            sehr schnell blinkend
# Test / Kontakt-Test      violett (pulsierend, bei        pulsierend (bei geschlossenem
#                          geschlossenem Kontakt dauer)    Kontakt dauer an)
# Sucht WLAN               blau, langsam pulsierend        langsam pulsierend
# Zentrale nicht erreicht  orange, blinkend                blinkend
# Mit Zentrale verbunden   3 s grün, dann aus              3 s an, dann aus
# Nicht verfügbar          gelb, schwach                   aus
# Alles in Ordnung         aus (oder schwach grün mit      aus
#                          „Ruhelicht“)

globals:
  - { id: led_alarm_bis, type: uint32_t, initial_value: '0' }
  - { id: led_test_bis, type: uint32_t, initial_value: '0' }
  - { id: led_ok_bis, type: uint32_t, initial_value: '0' }
  - { id: led_demo_start, type: uint32_t, initial_value: '0' }
  - { id: led_ota, type: bool, initial_value: 'false' }
  - { id: led_status, type: int, restore_value: true, initial_value: '0' }   # 0 verfügbar, 1 nicht verfügbar, 2 abwesend
  - { id: led_last, type: uint32_t, initial_value: '0' }
  - { id: led_lit, type: bool, initial_value: 'false' }

mqtt:
  on_connect:
    - globals.set: { id: led_ok_bis, value: !lambda 'return millis() + 3000;' }
  on_message:
    - topic: alarm/${kennung}/led/status
      then:
        - globals.set:
            id: led_status
            value: !lambda 'return x == "away" ? 1 : x == "absent" ? 2 : 0;'
    - topic: alarm/${kennung}/led/test
      then:
        - if:
            condition: { lambda: 'return x == "demo";' }
            then: [ globals.set: { id: led_demo_start, value: !lambda 'return millis() | 1;' } ]
            else: [ globals.set: { id: led_test_bis, value: !lambda 'return millis() + 5000;' } ]

switch:
  - platform: template
    name: "LED"
    id: led_an
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "LED Ruhelicht"
    id: led_ruhelicht
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: template
    name: "LED Helligkeit"
    id: led_helligkeit
    optimistic: true
    restore_value: true
    initial_value: 40
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: "%"

select:
  - platform: template
    name: "LED Modus"
    id: led_modus
    optimistic: true
    restore_value: true
    options: ["Alles", "Nur Alarm und Fehler", "Nur Alarm"]
    initial_option: "Alles"

text_sensor:
  - platform: template
    name: "LED Typ"
    lambda: 'return {"${led_typ}"};'
    update_interval: 300s

interval:
  - interval: 50ms
    then:
      - lambda: |-
          const uint32_t t = millis();
          const bool rgb = ${led_rgb};
          auto blink = [&](uint32_t on, uint32_t period) { return (t % period) < on ? 1.0f : 0.0f; };
          auto pulse = [&](uint32_t period) { float x = (t % period) / (float) period; return 0.12f + 0.88f * (x < 0.5f ? x * 2 : (1 - x) * 2); };
          // Welcher Zustand? 0 aus · 1 Alarm · 2 Update · 3 Test · 4 sucht WLAN · 5 Zentrale weg · 6 verbunden · 7 nicht verfügbar · 8 Ruhelicht
          int code = 0;
          const std::string modus = id(led_modus).current_option();
          const int stufe = modus == "Nur Alarm" ? 0 : modus == "Nur Alarm und Fehler" ? 1 : 2;
          const bool wifi_ok = wifi::global_wifi_component->is_connected();
          const bool mqtt_ok = mqtt::global_mqtt_client->is_connected();
          const bool test = id(kontakt_test).state || id(led_test_bis) > t;
          if (id(led_demo_start)) {
            const uint32_t step = (t - id(led_demo_start)) / 1500;
            if (step < 7) code = (int) step + 1; else id(led_demo_start) = 0;
          }
          if (!code && id(led_an).state) {
            if (id(led_alarm_bis) > t) code = 1;
            else if (id(led_ota)) code = 2;
            else if (test) code = 3;
            else if (stufe >= 1 && !wifi_ok) code = 4;
            else if (stufe >= 1 && !mqtt_ok) code = 5;
            else if (stufe >= 2 && id(led_ok_bis) > t) code = 6;
            else if (stufe >= 2 && id(led_status) == 1) code = 7;
            else if (stufe >= 2 && id(led_ruhelicht).state) code = 8;
          }
          float r = 0, g = 0, b = 0, lvl = 0;
          switch (code) {
            case 1: r = 1; lvl = blink(150, 300); break;
            case 2: g = 1; b = 1; lvl = blink(100, 200); break;
            case 3: r = .6f; b = 1; lvl = (id(kontakt_test).state && id(kontakt).state) ? 1 : pulse(1500); break;
            case 4: b = 1; lvl = pulse(2400); break;
            case 5: r = 1; g = .45f; lvl = blink(500, 1000); break;
            case 6: g = 1; lvl = 1; break;
            case 7: r = 1; g = .8f; lvl = rgb ? .3f : 0; break;
            case 8: g = 1; lvl = rgb ? .15f : 0; break;
          }
          const float level = lvl * id(led_helligkeit).state / 100.0f;
          if (level < 0.01f) {
            if (id(led_lit)) { auto c = id(status_led).turn_off(); c.set_transition_length(0); c.perform(); id(led_lit) = false; }
            return;
          }
          const uint32_t key = ((uint32_t) (r * 15) << 16) | ((uint32_t) (g * 15) << 12) | ((uint32_t) (b * 15) << 8) | (uint32_t) (level * 255);
          if (id(led_lit) && key == id(led_last)) return;
          id(led_last) = key;
          auto c = id(status_led).turn_on();
          c.set_transition_length(0);
          c.set_brightness(level);
          if (rgb) c.set_rgb(r, g, b);
          c.perform();
          id(led_lit) = true;
