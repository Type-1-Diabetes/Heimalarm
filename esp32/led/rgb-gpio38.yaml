# Farbige LED (WS2812) des ESP32-S3-DevKitC-1 und vieler N16R8-Nachbauten an GPIO38.
# Für Boards mit der LED an GPIO38 (Espressif DevKitC-1 v1.1).
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: GPIO38
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
