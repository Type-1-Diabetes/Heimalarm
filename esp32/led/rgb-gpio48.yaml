# Farbige LED (WS2812) des ESP32-S3-DevKitC-1 und vieler N16R8-Nachbauten an GPIO48.
# Neuere Espressif-Boards (v1.1) haben sie an GPIO38: in alarm-ich-s3.yaml rgb-gpio38.yaml einbinden.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
