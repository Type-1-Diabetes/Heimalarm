# Heimalarm – Mosquitto
persistence true
persistence_location /mosquitto/data/

# ESP32
listener 1883

# App (Handy/PC) über WebSocket
listener 9001
protocol websockets

# Nur mit Benutzer und Passwort. Die Passwortdatei erzeugt der Container beim Start
# aus MQTT_USER / MQTT_PASSWORD in zentrale/.env (siehe .env.example).
allow_anonymous false
password_file /mosquitto/data/passwd
# Wer was darf (Hauptkonto alles, optionales ESP32-Konto nur alarm/…), ebenfalls beim Start erzeugt
acl_file /mosquitto/data/acl
